# Nginx config for ulmezinsaat.com, kept here for reference so it doesn't
# have to be reconstructed from memory on a future redeploy.
#
# Install: copy to /etc/nginx/sites-available/ulmez-insaat, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`. The SSL directives
# (marked "managed by Certbot") are auto-generated the first time you run
# `certbot --nginx -d ulmezinsaat.com -d www.ulmezinsaat.com` — don't write
# them by hand, let Certbot add them.
#
# IMPORTANT: the /uploads/ block below serves that folder directly from disk
# instead of proxying to Node. This is not optional — `next start` only
# discovers the files that existed in public/uploads/ when the process last
# started, so a photo uploaded through the admin panel while the app is
# already running would 404 until the next restart if this were removed.

server {
    server_name ulmezinsaat.com www.ulmezinsaat.com;

    client_max_body_size 15M;

    location /uploads/ {
        alias /var/www/ulmez-insaat/public/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ulmezinsaat.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ulmezinsaat.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ulmezinsaat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ulmezinsaat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ulmezinsaat.com www.ulmezinsaat.com;
    return 404; # managed by Certbot
}
